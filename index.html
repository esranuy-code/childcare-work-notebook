<body>
<header class="top"><div class="top-inner"><span class="top-icon" id="brand-icon"></span><a href="#home">보육 업무 수첩</a></div></header>
<main class="wrap" id="app"></main>
<script>
'use strict';
function parseCSV(csv){
 const rows=[];let row=[],field='',quoted=false;
 for(let i=0;i<csv.length;i++){
  const ch=csv[i];
  if(ch==='"'){if(quoted&&csv[i+1]==='"'){field+='"';i++;}else quoted=!quoted;}
  else if(ch===','&&!quoted){row.push(field);field='';}
  else if(ch==='\n'&&!quoted){row.push(field.replace(/\r$/,''));rows.push(row);row=[];field='';}
  else field+=ch;
 }
 if(row.length||field){row.push(field.replace(/\r$/,''));rows.push(row);}
 const headers=rows.shift();headers[0]=headers[0].replace(/^\uFEFF/,'');
 return rows.filter(cells=>cells.some(Boolean)).map(cells=>Object.fromEntries(headers.map((key,i)=>[key,cells[i]??''])));
}
const source=JSON.parse(document.getElementById('source-data').textContent);
const periods=parseCSV(source.periods),compare=parseCSV(source.compare),rates=parseCSV(source.rates);
const app=document.getElementById('app');
const icons={
 book:'<rect x="5" y="3" width="15" height="18" rx="2"/><path d="M9 3v18M3 7h4M3 12h4M3 17h4m9-9h5m-5 4h5"/>',
 budget:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 16v-4m5 4V8m5 8V6"/>',
 pay:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18m-13 5h2m3 0h3m-8 3h2"/>',
 haengbok:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4M8 8h8m-8 4h5"/>',
 childcare:'<path d="m3 10 9-7 9 7M5 9v11h14V9m-9 11v-5h4v5"/>'
};
const svg=name=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+icons[name]+'</svg>';
document.getElementById('brand-icon').innerHTML=svg('book');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const present=value=>value!==''&&value!=null;
const nf=new Intl.NumberFormat('ko-KR');
const fmt=n=>(n<0?'△':'')+nf.format(Math.abs(n));
const pct=n=>new Intl.NumberFormat('ko-KR',{maximumFractionDigits:1}).format(n)+'%';
const amount=value=>present(value)?fmt(Number(value)):'—';
const sum=(rows,key)=>rows.reduce((total,row)=>total+Number(row[key]),0);
const ordered=rows=>rows.slice().sort((a,b)=>Number(a.no)-Number(b.no));
const funding=[
 {key:'gook',label:'국비',color:'#43877a'},{key:'gigeum',label:'기금',color:'#7966a1'},
 {key:'do',label:'도비',color:'#557eb5'},{key:'si',label:'시비',color:'#bf8154'}
];
const periodInfo={
 '2026-3':['2026년 3회 추경','합본예산서(3회추경까지 반영) 기준입니다.'],
 '2026-4':['2026년 4회 추경','4회추경 예산요구서(변경내시 반영) 기준입니다.','2026-3'],
 '2027-0':['2027년 본예산','세출예산요구서(가내시 반영) 기준입니다.','2026-4'],
 '2027-1':['2027년 1회 추경','아직 편성 전입니다. 1회추경 요구액이 나오면 이곳에 채워집니다.','2027-0']
};
const checkCount=compare.filter(row=>['차이','가내시 미확인'].includes(row.status)).length;
const metric=(label,value,detail='')=>'<div class="metric"><span>'+label+'</span><strong>'+value+'</strong>'+(detail?'<span>'+detail+'</span>':'')+'</div>';
const pill=(label,tone='')=>'<span class="pill '+tone+'">'+esc(label)+'</span>';
const panel=(title,content)=>'<section class="panel"><h2>'+title+'</h2>'+content+'</section>';
const hero=(title,description,compact=false)=>'<section class="hero '+(compact?'compact':'')+'"><h1>'+title+'</h1><p>'+description+'</p></section>';
const back='<a class="back" href="#home">← 업무 수첩</a>';
const empty=message=>'<p class="empty">'+message+'</p>';
const details=(label,items)=>'<details class="criteria"><summary>'+label+'</summary><ul>'+items.map(item=>'<li>'+item+'</li>').join('')+'</ul></details>';
const budgetNotes=[
 '2026년 3회 추경은 합본예산서, 2026년 4회 추경은 4회추경 예산요구서, 2027년 본예산은 세출예산요구서 기준입니다. 2027년 1회 추경은 편성 전입니다.',
 '재원별 금액은 원자료에 있거나 도비 100%, 시비 100%, 도비·시비 50:50처럼 비율로 구분되는 사업만 반영했습니다.',
 '2027년부터 영유아보육료·가정양육수당·부모급여의 국비·도비·시비 보조율은 75 / 17.5 / 7.5에서 65 / 17.5 / 17.5로, 급식위생관리는 60 / 28 / 12에서 50 / 25 / 25로 바뀝니다.',
 '교사대아동비율개선(보육료)과 아동기본수당(가정보육가산금)의 국비는 기금으로 편성합니다.',
 '무상보육 4~5세 지원은 2027년부터 무상보육 3~5세 지원으로 통합됩니다.'
];
const payNotes=[
 '월 단위로 계산합니다. 부모급여는 출생월부터 월령 23개월까지이며 2023년부터 적용합니다. 첫 생일이 속한 달부터 1세 단가를 적용합니다.',
 '가정양육수당은 월령 24개월부터 취학하는 해의 2월까지, 최대 월령 85개월까지 계산합니다. 취학을 유예하면 월령 85개월까지 적용합니다.',
 '출생일을 포함하여 60일이 지난 뒤 신청하면 신청월부터 지급하도록 계산합니다.',
 '부모급여(현금) 첫 정기지급은 15일까지 신청하면 신청월, 16일 이후 신청하면 다음 달로 예상합니다. 출생월 등 앞선 달의 소급분과 정기지급월분을 구분해 표시합니다. 자격 결정 시점과 수시지급 여부에 따라 실제 지급월은 달라질 수 있습니다.',
 '어린이집 시작월부터 종료월까지 부모급여는 현금 차액만 표시하고, 가정양육수당은 0원으로 표시합니다. 종료월을 비우면 계속 이용으로 계산합니다.',
 '적용 연도와 월령에 맞는 단가를 찾고 자료에 단가가 없는 달은 합계에서 제외합니다.',
 '지급일은 매월 25일(토·공휴일이면 전날)이며, 어린이집 이용 시 부모급여 차액은 다음 달 20일입니다. 실제 지급액은 행복e음 결정 내역으로 확인합니다.'
];
let tab='status',period='2027-0',query='';
const payState={birth:'',apply:'',start:'',end:'',kind:'general',defer:false};
function home(){
 const tiles=[
  ['budget','예산 관리','추경·본예산별 담당사업 예산 · 재원 · 가내시 비교','2027 본예산 '+(sum(compare,'req2027')/100000).toFixed(1)+'억원 · 확인 필요 '+checkCount+'건'],
  ['pay','부모급여 및 양육수당','부모급여 · 가정양육수당 업무','급여 지급 계산기'],
  ['haengbok','행복e음','메뉴 코드 · 해외체류 지급정지 · 인적변동 정비',''],
  ['childcare','보육통합정보시스템','준비 중','']
 ];
 return hero('보육 업무 수첩','포천시 교육정책과 · 보육 업무')+'<nav class="tiles" aria-label="업무 선택">'+tiles.map(([key,title,desc,meta])=>'<a class="tile" href="#'+key+'"><span class="tile-icon">'+svg(key)+'</span><h2>'+title+'</h2><p>'+desc+'</p>'+(meta?'<strong>'+meta+'</strong>':'')+'</a>').join('')+'</nav>';
}
const funded=row=>funding.every(({key})=>present(row[key]));
function project(row,previous){
 const [,,prevPeriod]=periodInfo[row.period];
 const diff=previous?Number(row.amount)-Number(previous.amount):0;
 const delta=!prevPeriod?'':!previous?esc(periodInfo[prevPeriod][0])+'에 없던 사업':diff===0?'변동 없음':esc(periodInfo[prevPeriod][0])+' 대비 '+(diff>0?'+':'')+fmt(diff)+'천원';
 const fundItems=funding.filter(item=>item.key!=='gigeum'||Number(row.gigeum)>0);
 const portion=item=>Number(row.amount)?100*Number(row[item.key])/Number(row.amount):0;
 let funds;
 if(funded(row)){
  funds='<div class="bar" aria-hidden="true">'+fundItems.map(item=>'<span style="width:'+portion(item)+'%;background:'+item.color+'"></span>').join('')+'</div><div class="fund-grid">'+fundItems.map(item=>'<div class="fund-cell" style="--fund:'+item.color+'"><span>'+item.label+'</span><strong>'+amount(row[item.key])+'</strong><span>'+pct(portion(item))+'</span></div>').join('')+'</div>';
 }else{
  funds=row.period.startsWith('2027')?'<p class="notice fine">재원 미확인 · 이번 가내시 파일에 없음</p>':'<p class="fine">재원별 금액 자료 없음</p>';
 }
 const execRate=Number(row.amount)?100*Number(row.exec)/Number(row.amount):0;
 const exec=row.period.startsWith('2027')?'<div class="exec"><strong>집행</strong><progress aria-label="집행률" max="100" value="'+Math.min(100,Math.max(0,execRate))+'"></progress><span>'+(present(row.exec)?pct(execRate)+(row.execAsOf?' · '+esc(row.execAsOf):''):'미입력')+'</span></div>':'';
 return '<article class="project"><div><h3><span class="number">'+esc(row.no)+'</span>'+esc(row.name)+(row.type==='자체'?pill('자체','gray'):'')+'</h3><div class="amount">'+amount(row.amount)+' <span class="unit">천원</span></div>'+(delta?'<p class="delta '+(diff<0?'down':diff>0?'up':'')+'">'+delta+'</p>':'')+'</div><div class="funding">'+funds+'</div>'+exec+'</article>';
}
function renderProjects(){
 const rows=ordered(periods.filter(row=>row.period===period));
 const previous=new Map(periods.filter(row=>row.period===periodInfo[period][2]).map(row=>[row.name,row]));
 const visible=rows.filter(row=>row.name.toLowerCase().includes(query.trim().toLowerCase()));
 document.getElementById('project-list').innerHTML=visible.length?visible.map(row=>project(row,previous.get(row.name))).join(''):empty(rows.length?'검색 결과가 없습니다.':periodInfo[period][1]);
}
function statusPane(){
 const [title,desc]=periodInfo[period];

const monthNo=value=>{const [y,m]=value.split('-').map(Number);return y*12+m-1;};
const yearOf=i=>Math.floor(i/12);
const monthOf=i=>i%12+1;
const monthLabel=i=>yearOf(i)+'.'+String(monthOf(i)).padStart(2,'0');
const periodLabel=(a,b)=>monthLabel(a)+' ~ '+monthLabel(b);
const currentMonth=()=>monthNo(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit'}).formatToParts(new Date()).filter(part=>['year','month'].includes(part.type)).sort((a,b)=>a.type==='year'?-1:1).map(part=>part.value).join('-'));
function calculate({birth,apply,start,end,kind,defer}){
 const b=monthNo(birth),limit=defer?b+85:Math.min(b+85,(yearOf(b)+7)*12+1);
 const deadline=new Date(Date.parse(birth+'T00:00:00Z')+59*86400000).toISOString().slice(0,10);
 const late=Boolean(apply&&apply>deadline),firstPay=late?monthNo(apply):b;
 const startAt=start?monthNo(start):Infinity,endAt=end?monthNo(end):Infinity;
 const rows=[];
 for(let i=b;i<=limit;i++){
  const age=i-b,parent=age<24,program=parent?'부모급여':'양육수당';
  const daycare=i>=startAt&&i<=endAt;
  let rate=null,label='',value=null;
  if(parent&&yearOf(i)<2023)label='부모급여 도입 전';
  else if(i<firstPay)label='미지급(신청 전)';
  else if(daycare&&!parent){label='어린이집 이용 · 현금 없음';value=0;}
  else{
   const kindForMonth=parent?(daycare?'daycare':'home'):kind;
   rate=rates.find(row=>row.program===program&&row.kind===kindForMonth&&age>=Number(row.from_m)&&age<=Number(row.to_m)&&yearOf(i)>=Number(row.year_from)&&(!row.year_to||yearOf(i)<=Number(row.year_to)));
   label=rate?.label??'단가 미등록';
   if(rate)value=Number(rate.amount);
  }
  rows.push({i,age,program,daycare,label,value,rate:rate?.id??null,tone:rate?(parent?(age<12?'pg0':'pg1'):'ys'):'none'});
 }
 return {rows,late,deadline};
}
function payCalendar(rows,now,firstPayment){
 const byMonth=new Map(rows.map(row=>[row.i,row]));
 const moved=new Set(firstPayment?.installments.filter(row=>row.i<firstPayment.firstMonth).map(row=>row.i));
 const firstMonth=firstPayment?.firstMonth;
 const retroTotal=moved.size?sum(firstPayment.installments.filter(row=>moved.has(row.i)),'value'):0;
 const cashLabel=value=>value===null?'—':value===0?'0원':new Intl.NumberFormat('ko-KR',{maximumFractionDigits:4}).format(value/10000)+'만';
 let html='';
 for(let year=yearOf(rows[0].i);year<=yearOf(rows.at(-1).i);year++){
  const cells=[];let total=0;
  for(let m=0;m<12;m++){
   const i=year*12+m,row=byMonth.get(i);
   if(!row){cells.push('<td class="off">—</td>');continue;}
   const shifted=moved.has(i);
   const combined=i===firstMonth&&moved.size>0;
   const value=shifted?null:combined?(row.value??0)+retroTotal:row.value;
   total+=value??0;
   const destination=yearOf(i)===yearOf(firstMonth)?monthOf(firstMonth)+'월':monthLabel(firstMonth);
   const label=monthLabel(i)+' · '+row.age+'개월 · '+row.label+(shifted?' · '+destination+' 지급 예상':value===null?'':' · '+fmt(value)+'원');
   const breakdown=combined?firstPayment.installments.map(part=>{
    const month=yearOf(part.i)===year?monthOf(part.i)+'월':monthLabel(part.i);
    return '<span>'+month+(part.i<firstMonth?' 소급 ':' 당월 ')+cashLabel(part.value)+'</span>';
   }).join(''):'';
   const other=combined&&row.daycare&&row.value>0?'<span>어린이집 '+cashLabel(row.value)+'</span>':'';
   const detail=shifted?'<span>'+destination+' 지급</span>':combined?breakdown+other:'<span>'+(row.daycare?'어린이집':row.age+'개월')+'</span>';
   const cellClass=shifted?'none':combined&&!row.rate?firstPayment.installments[0].tone:row.tone;
   cells.push('<td class="pay '+cellClass+(row.daycare?' daycare':'')+(i===now?' current':'')+'" title="'+esc(label)+'"><strong>'+cashLabel(value)+'</strong>'+detail+'<span hidden>'+esc(row.label)+'</span></td>');
  }
  html+='<tr><th scope="row">'+year+'</th>'+cells.join('')+'<td class="num"><strong>'+fmt(total)+'원</strong></td></tr>';
 }
 const legend='<div class="legend"><span class="pg0">부모급여 0세</span><span class="pg1">부모급여 1세</span><span class="ys">가정양육수당</span><span class="none">미지급·해당 없음</span><span class="daycare">어린이집 이용</span></div>';
 const timing=moved.size?'<p class="fine">부모급여(현금) 소급분은 첫 정기지급 예상월에 합산했습니다.</p>':'';
 return panel('월별 지급 달력',timing+legend+table(['연도',...Array.from({length:12},(_,i)=>(i+1)+'월'),'연간 합계'],html,'calendar','월별 지급 달력'));
}
function segments(rows,now){
 const groups=[];
 for(const row of rows){
  const last=groups.at(-1);
  if(last&&last.program===row.program&&last.label===row.label&&last.value===row.value&&last.daycare===row.daycare&&last.rate===row.rate){last.end=row;last.count++;}
  else groups.push({...row,end:row,count:1});
 }
 const body=groups.map(g=>'<tr><td>'+esc(g.label)+(now>=g.i&&now<=g.end.i?pill('이번 달'):'')+'</td><td>'+periodLabel(g.i,g.end.i)+'</td><td>'+g.age+'~'+g.end.age+'개월</td><td>'+g.count+'개월</td><td class="num">'+(g.value===null?'—':fmt(g.value)+'원')+'</td><td class="num">'+(g.value===null?'—':fmt(g.value*g.count)+'원')+'</td></tr>').join('');
 return panel('구간별 정리',table(['구분','기간','월령','개월 수','월 지급액','소계'],body,'segments','구간별 정리'));
}
function firstParentPayment(rows,applicationDate){
 if(!applicationDate)return null;
 const firstMonth=monthNo(applicationDate)+(Number(applicationDate.slice(-2))>15?1:0);
 const installments=rows.filter(row=>row.program==='부모급여'&&!row.daycare&&row.i<=firstMonth&&row.value>0);
 return installments.length?{firstMonth,installments,total:sum(installments,'value')}:null;
}

 `;

 }

  ];

  return;
 }
 const rules=[
  ['중지','기본보육, 누리, 유아학비','변동일자 당월','대상자 신청 필요'],
  ['정지','양육수당, 부모급여','변동일자 다음 달','담당자 직권 처리 가능']
 ];
 const ruleRows=rules.map(row=>'<tr>'+row.map(value=>'<td>'+esc(value)+'</td>').join('')+'</tr>').join('');
 const procedures=[
  {
   "title": "출입국만료보장중지대상",
   "steps": [
    "이름 클릭 - 변동사항 반영 체크하고 이동",
    "돋보기 클릭하여 아동 이름 선택",
    "직권등록 > 사유 - 보장내역변경",
    "보장결정요청(하단) - 가구원이름 선택 - 결정상태: 중지로 변경, 중지일자 변경, 사유: 해외체류(90일 이상) 변경",
    "전자결재요청",
    "통합상담관리 작성 - 대상자: 아동이름으로 바꾸고 작성"
   ]
  },
  {
   "title": "출입국만료보장정지대상",
   "steps": [
    "이름 클릭 - 변동사항 반영 체크하고 이동",
    "돋보기 클릭하여 아동 이름 선택",
    "직권등록 > 사유 - 보장내역변경",
    "보장정보탭 - 가구원 이름 선택 - 상태: 급여정지로 변경, 종료일자 변경, 사유: 해외체류90일이상으로 변경",
    "저장 후 직권등록완료",
    "통합상담관리 작성 - 대상자: 아동이름으로 바꾸고 작성"
   ]
  },
  {
   "title": "출입국만료재책정대상",
   "steps": [
    "양육수당: 어린이집 재원 시 지급 불가하므로 보육통합시스템 통해 재원여부확인",
    "이름 클릭 - 변동사항 반영 체크하고 이동",

    "직권등록 > 사유 - 보장내역변경",

    "저장 후 직권등록완료",
    "통합상담관리 작성- 대상자: 아동이름으로 바꾸고 작성"
   ]
  }
 ];
 const procedureCards=procedures.map(({title,steps})=>'<details class="criteria maintenance-step"><summary>'+esc(title)+'</summary><ol>'+steps.map(step=>'<li>'+esc(step)+'</li>').join('')+'</ol></details>').join('');
 const maintenance=panel('행복e음 정비방법','<p class="muted">변동집계현황 → 인적변동</p>'+procedureCards);
 const suspensionStart='국외 체류기간이 90일이 되는 날이 속하는 달의 다음 달';
 const suspensionRows=[
  ['양육수당',suspensionStart,'입국일이 속한 달부터'],

 ].map(row=>'<tr>'+row.map(value=>'<td>'+esc(value)+'</td>').join('')+'</tr>').join('');
 const suspension=table(['급여','지급정지 시작월','재지원 시작월'],suspensionRows,'system-rules','해외체류 지급정지 기간');
 app.innerHTML=heading+panel('중지·정지',table(['구분','대상','적용 시점','재책정'],ruleRows,'system-rules','행복e음 중지·정지 기준'))+panel('해외체류 지급정지 기간',suspension)+maintenance;
}
function navigate(){
 const view=location.hash.slice(1);
 if(view==='budget')budget();
 else if(view==='pay')pay();
 else if(view==='haengbok'||view==='system')haengbok();
 else if(view==='haengbok-guidance'||view==='haengbok-grants')haengbok(view);
 else if(view==='childcare'||view==='system-childcare')app.innerHTML=back+hero('보육통합정보시스템','준비 중',true);
 else app.innerHTML=home();
 window.scrollTo(0,0);
}
app.addEventListener('click',event=>{
 const button=event.target.closest('button');
 if(!button)return;
 const {tab:nextTab,period:nextPeriod}=button.dataset;
 if(nextTab){tab=nextTab;budget();app.querySelector('[data-tab="'+tab+'"]').focus();}
 if(nextPeriod){period=nextPeriod;budget();app.querySelector('[data-period="'+period+'"]').focus();}
});
window.addEventListener('hashchange',navigate);
navigate();
if (location.protocol !== 'file:' && 'serviceWorker' in navigator) {
 navigator.serviceWorker.register('./sw.js').catch(error => console.warn('오프라인 준비에 실패했습니다.', error));
}
</script>
